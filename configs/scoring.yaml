# LeadGuard Decision Policy Scenarios
# Phase E: Decision Science Configuration

# The system operates across explicit policy scenarios to ensure decisions are robust
# to reasonable cost/benefit assumptions.

active_learning:
  initial_labeled_fraction: 0.10
  batch_size: 500
  n_rounds: 10

scenarios:
  base:
    inspection:
      cost_usd: 500.0
    intervention:
      # Expected monetized benefit of replacing a lead service line
      # (e.g. avoided health costs, infrastructure upgrade value)
      value_usd: 5000.0
    equity:
      # Weight applied to the equity boost penalty/reward
      weight: 1000.0
    
  conservative:
    inspection:
      cost_usd: 800.0
    intervention:
      value_usd: 3000.0
    equity:
      weight: 500.0
      
  high_benefit:
    inspection:
      cost_usd: 400.0
    intervention:
      value_usd: 10000.0
    equity:
      weight: 2000.0
